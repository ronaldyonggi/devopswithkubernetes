apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
      - name: log-output
        image: yonggsnap/log-output:2.3
        env:
        - name: PORT
          value: "3001"