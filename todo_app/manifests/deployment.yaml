apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
      - name: image-cache
        emptyDir: {}
      containers:
      - name: todo-app
        image: yonggsnap/todo-app:1.8
        env:
        - name: PORT
          value: "8080"
        - name: IMAGE_URL
          valueFrom:
            configMapKeyRef:
              name: todo-app-configmap
              key: IMAGE_URL
        volumeMounts:
        - name: image-cache
          mountPath: /usr/src/app/files