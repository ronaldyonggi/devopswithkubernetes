apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
      - name: log-storage
        persistentVolumeClaim:
          claimName: shared-log-pvc
      containers:
      - name: ping-pong
        image: yonggsnap/ping-pong:1.3
        volumeMounts:
        - name: log-storage
          mountPath: /usr/src/app/files
