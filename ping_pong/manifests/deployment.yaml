apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
      - name: ping-pong
        image: yonggsnap/ping-pong:1.7
        env:
        - name: DATABASE_URL
          value: "postgres://postgres:postgres@postgres-svc:5432/postgres"
      
