apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-log-pv
spec:
  storageClassName: shared-log-storage
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: "/tmp/shared-logs"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - k3d-k3s-default-agent-0
